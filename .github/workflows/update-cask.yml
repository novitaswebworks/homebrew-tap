name: Update Cask

# Triggered by the desktop app repo via repository_dispatch
# OR manually for testing
on:
  repository_dispatch:
    types: [app-released]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to update (e.g. 1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "VERSION=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download DMG and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          URL="https://github.com/lordbobby-dot/novaterm/releases/download/v${VERSION}/NovaTerm_${VERSION}_universal.dmg"
          echo "Downloading $URL ..."
          curl -sSL -o novaterm.dmg "$URL"
          SHA=$(shasum -a 256 novaterm.dmg | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256 = $SHA"

      - name: Update Cask formula
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.SHA256 }}"
          # Update version
          sed -i '' "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/novaterm.rb
          # Replace sha256 line (handles both :no_check and real hashes)
          sed -i '' "s/sha256 .*/sha256 \"${SHA}\"/" Casks/novaterm.rb
          echo "Updated Casks/novaterm.rb to v${VERSION} sha256=${SHA}"
          cat Casks/novaterm.rb

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/novaterm.rb
          git diff --staged --quiet || git commit -m "chore: update novaterm to v${{ steps.vars.outputs.VERSION }}"
          git push
